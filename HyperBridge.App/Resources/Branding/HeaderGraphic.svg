  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <image href="HyperBridge.png" x="320" y="12" width="760" height="760" transform="scale(0.52)" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
